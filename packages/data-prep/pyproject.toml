[project]
name = "data-prep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steve Shea", email = "stevenlsjr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=1.5.6",
    "kagglehub>=1.0.2",
    "numpy>=2.5.4",
    "psycopg>=3.3.6",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
data-prep = "data_prep:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
