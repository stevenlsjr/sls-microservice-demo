[project]
name = "movie-review-rest-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steve Shea", email = "stevenlsjr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "litestar[standard]>=2.24.0",
    "msgspec>=0.22.0",
    "psycopg>=3.3.6",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
movie-review-rest-api = "movie_review_rest_api:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
