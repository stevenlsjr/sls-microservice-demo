[project]
name = "sls-microservices-web-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steve Shea", email = "stevenlsjr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.24.0",
    "msgspec>=0.22.0",
]

[project.scripts]
sls-microservices-web-api = "sls_microservices_web_api:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
