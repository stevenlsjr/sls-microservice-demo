apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: sls-microservices-demo
      app.kubernetes.io/managed-by: kustomize
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: psql-env
    envs:
      - ./psql.secret.env
resources:
  - ./postgres-dev.yaml
  - initdb-job.yaml
  - ./keycloak.yaml
  - ./kafka-single-node.yaml
  - ./apicurio-registry.yaml

helmCharts: []