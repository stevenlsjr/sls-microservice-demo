apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: microservice-demo

spec:
  instances: 1
  db:
    vendor: postgres
    host: postgres-db
    usernameSecret:
      name: psql-env
      key: POSTGRES_USER
    passwordSecret:
      name: psql-env
      key: POSTGRES_PASSWORD
  http:
    httpEnabled: true
  hostname:
    strict: false
    hostname: test.keycloak.org
  proxy:
    headers: xforwarded
  features:
    enabled:
      - client-admin-api:v2
---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: keycloak-dev-reaml
  namespace: microservice-demo

spec:
  keycloakCRName: keycloak
  realm:
    id: dev-realm
    realm: dev-realm
    displayName: DevRealm
    enabled: true