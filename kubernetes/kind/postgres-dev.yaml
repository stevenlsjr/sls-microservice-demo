apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: microservice-demo
  
spec:
  selector:
    matchLabels:
      app: postgres # has to match .spec.template.metadata.labels
  serviceName: "postgres"
  replicas: 1 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: postgres # has to match .spec.selector.matchLabels
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: postgres
        image: 'postgres:18-alpine'
        ports:
        - containerPort: 5432
          name: psql
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/18/docker
        env:
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        envFrom:
        - secretRef:
            name: psql-env
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

--- 
# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: microservice-demo

spec:
  selector:
    app: postgres
  type: LoadBalancer
  ports:
  - name: postgres
    protocol: TCP
    port: 5432
    targetPort: 5432
 